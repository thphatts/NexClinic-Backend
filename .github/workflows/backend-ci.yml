name: NexClinic Backend CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Unit Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven Test Compile & Unit Tests
        run: ./mvnw clean test -DskipITs

      - name: Verify Production Package (JAR Build)
        run: ./mvnw package -DskipTests

      - name: Trigger Render Deployment Hook
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "Triggering Render Auto-Deploy..."
            curl -X POST "$RENDER_HOOK"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret is not set yet. Skipping Render trigger."
          fi
