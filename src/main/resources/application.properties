spring.application.name=clinicportal
server.port=${PORT:8080}

# PostgreSQL Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?prepareThreshold=0}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=false
spring.flyway.locations=classpath:db/migration

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# AI Medical Assistant Configuration
app.ai.google.api-key=${GEMINI_API_KEY:}
app.ai.active-provider=auto

# AI Embedding Configuration (gemini | tfidf | auto)
# 'auto' sẽ tự động chọn Gemini nếu có API Key, ngược lại dùng TF-IDF offline
app.ai.embedding.provider=auto

# Scheduling - Cho phép @Scheduled annotation
spring.task.scheduling.pool.size=3
